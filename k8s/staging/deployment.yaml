apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: staging

spec:
  replicas: 1

  selector:
    matchLabels:
      app: demo-app

  template:
    metadata:
      labels:
        app: demo-app

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: demo-app
          image: IMAGE_URI

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
